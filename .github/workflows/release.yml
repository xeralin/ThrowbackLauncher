name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_VERSION: "1.98.1"
  APPIMAGETOOL_VERSION: "1.9.1"
  APPIMAGETOOL_SHA256: "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal --no-self-update --component clippy,rustfmt
          rustup default $RUST_VERSION
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig-dev libxkbcommon-dev
      - name: Lint
        working-directory: app
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: app
        run: cargo test --workspace --locked

  liberator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal --no-self-update --target x86_64-pc-windows-gnu
          rustup default $RUST_VERSION
      - name: Install mingw and git-crypt
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 git-crypt
      - name: Unlock Liberator sources
        env:
          LIBERATOR_KEY: ${{ secrets.LIBERATOR_KEY }}
        run: |
          printf '%s' "$LIBERATOR_KEY" | base64 -d > "$RUNNER_TEMP/git-crypt.key"
          git-crypt unlock "$RUNNER_TEMP/git-crypt.key"
      - name: Build Liberator
        env:
          RUSTFLAGS: -Awarnings
        run: sh liberator/build.sh 2>/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: liberator
          path: build/Liberator.exe

  rvpn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal --no-self-update --target i686-pc-windows-msvc,x86_64-pc-windows-msvc
          rustup default $RUST_VERSION
      - name: Build Radmin VPN helpers
        run: sh rvpn/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: rvpn
          path: build/rvpn

  linux:
    needs: rvpn
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Pin version to tag
        run: printf '%s\n' "${GITHUB_REF_NAME#v}" > app/VERSION
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential curl file libfontconfig-dev libxkbcommon-dev pkg-config
      - name: Install Rust
        run: |
          curl -fsSL https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain $RUST_VERSION
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v8
        with:
          name: rvpn
          path: build/rvpn
      - name: Build Launcher
        working-directory: app
        run: cargo build --release --locked --features packaged
      - name: Package AppImage
        run: |
          appdir=build/AppDir
          mkdir -p "$appdir/usr/bin"
          cp app/target/release/launcher "$appdir/usr/bin/ThrowbackLauncher"
          cp -r build/rvpn "$appdir/usr/bin/rvpn"
          chmod +x "$appdir/usr/bin/rvpn/tap_bridge"
          ln -s usr/bin/ThrowbackLauncher "$appdir/AppRun"
          cp .github/icon.png "$appdir/ThrowbackLauncher.png"
          printf '[Desktop Entry]\nType=Application\nName=Throwback Launcher\nExec=ThrowbackLauncher\nIcon=ThrowbackLauncher\nTerminal=false\nCategories=Game;\nStartupWMClass=ThrowbackLauncher\n' > "$appdir/ThrowbackLauncher.desktop"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/$APPIMAGETOOL_VERSION/appimagetool-x86_64.AppImage"
          echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          chmod +x appimagetool
          mkdir -p out
          APPIMAGE_EXTRACT_AND_RUN=1 ./appimagetool "$appdir" out/ThrowbackLauncher.AppImage
      - uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: out/ThrowbackLauncher.AppImage

  windows:
    needs: liberator
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Pin version to tag
        shell: bash
        run: printf '%s\n' "${GITHUB_REF_NAME#v}" > app/VERSION
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install $RUST_VERSION --profile minimal --no-self-update
          rustup default $RUST_VERSION
      - uses: actions/download-artifact@v8
        with:
          name: liberator
          path: build
      - name: Build Launcher
        working-directory: app
        run: cargo build --release --locked --features packaged
      - name: Package
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item app/target/release/launcher.exe out/ThrowbackLauncher.exe
          Compress-Archive -Path out/ThrowbackLauncher.exe, build/Liberator.exe -DestinationPath out/Runtime.zip
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            out/ThrowbackLauncher.exe
            out/Runtime.zip

  release:
    needs: [check, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: "{appimage,windows,liberator}"
      - name: Create draft release with binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes ""
          gh release upload "$GITHUB_REF_NAME" \
            "artifacts/appimage/ThrowbackLauncher.AppImage" \
            "artifacts/windows/ThrowbackLauncher.exe" \
            "artifacts/liberator/Liberator.exe" \
            "artifacts/windows/Runtime.zip" \
            --clobber
