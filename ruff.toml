line-length = 100
target-version = 'py314'

[lint]
select = [
    'E4', 'E7', 'E9', 'F',
    'E501', 'B', 'UP', 'C4', 'RET', 'PIE', 'ISC', 'W', 'SIM', 'I', 'Q', 'PTH',
]

[lint.isort]
known-first-party = ['core', 'bridge', 'layout', 'app_window', 'presence', 'scheme', 'watchdog']

[lint.per-file-ignores]
'app/main.py' = ['E402']
